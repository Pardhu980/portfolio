<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects | Pardhu</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <style>
    body {
      background-color: #0e0e10;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    nav {
      background-color: #111;
      padding: 1rem 2rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    .logo {
      font-size: 1.5rem;
      color: #00ffe7;
    }

    .logo span {
      color: white;
    }

    .links a {
      margin: 0 10px;
      text-decoration: none;
      color: #00ffe7;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: white;
    }

    .main-container {
      max-width: 1200px;
      margin: auto;
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .projects-title {
      font-size: 2.8rem;
      color: #00ffe7;
      margin-bottom: 3rem;
      text-align: center;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      width: 100%;
    }

    .project-card {
      background: #1a1a1d;
      border: 1px solid #00ffe7;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 0 15px #00ffe78a;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .project-card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px #00ffe7;
    }

    .project-card h2 {
      color: #00ffe7;
      margin-bottom: 0.5rem;
    }

    .project-card p {
      margin: 0.3rem 0;
      line-height: 1.6;
      font-size: 1rem;
      text-align: center;
    }

    .project-card a {
      display: inline-block;
      margin-top: 1rem;
      color: #00ff99;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .project-card a:hover {
      color: #ffffff;
    }

    @media (max-width: 480px) {
      .projects-title {
        font-size: 2rem;
      }

      .project-card p {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <div class="logo">Pardha <span>Shankar</span></div>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="experience.html">Experience</a>
        <a href="contact.html">Contact</a>
        
      </div>
    </div>
  </nav>
  

  <section>
    <div class="main-container">
      <h1 class="projects-title" data-aos="fade-up">Projects</h1>
      <div class="project-grid">
        <div class="project-card" data-aos="fade-up" data-aos-delay="100">
          <h2>📚 ReadEase</h2>
          <p>Library Book Search App</p>
          <p>HTML, CSS, JavaScript</p>
          <a href="https://ahmed-shaik.github.io/ReadeEase/" target="_blank">Live Demo</a>
        </div>
        <div class="project-card" data-aos="fade-up" data-aos-delay="200">
          <h2>📈 Stock Market Prediction</h2>
          <p>LSTM Neural Network to predict prices</p>
          <p>Python, TensorFlow, Keras, Pandas</p>
        </div>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>AOS.init({ once: true });</script>
</body>
</html>
